[project]
name = "transcriptor-rt"
version = "0.4.0"
description = "Dictado local en tiempo real para Windows: panel flotante, bandeja y servicio de voz a texto consumible por API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jean-Carlo Macancela" }]
keywords = ["speech-to-text", "whisper", "faster-whisper", "dictation", "windows", "overlay", "local-first"]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Versiones fijadas: probadas en una RTX 5080 (Blackwell) con el CUDA Toolkit 12.9.
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "numpy>=2.2",
    "soundfile>=0.13",
    "soxr>=0.5",
    "sounddevice>=0.5",
    "nvidia-ml-py>=12.570",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "PySide6-Essentials>=6.8",  # overlay y bandeja (F2)
]

[project.urls]
Repositorio = "https://github.com/JeanCarloMacan/Desktop-transcriber"
Documentacion = "https://github.com/JeanCarloMacan/Desktop-transcriber/tree/main/docs"

[project.scripts]
voice-core = "voice_core.__main__:main"
voice-core-cli = "voice_core.cli:main"
tasks-service = "tasks_service.__main__:main"

[project.gui-scripts]
transcriptor = "overlay.__main__:main"

[dependency-groups]
spike = [
    "num2words>=0.5.14",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_core", "src/overlay", "src/tasks_service"]

[tool.uv]
default-groups = ["spike", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: necesita la RTX 5080 y el modelo large-v3 (se corre con -m gpu)"]
addopts = "-m 'not gpu'"
